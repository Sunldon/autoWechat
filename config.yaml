# 微信自动化配置
wechat:
  window:
    width: 1200
    height: 1200

  # 用户配置（本人信息）
  user:
    name: "哈哈"       # 用户姓名

  # 联系人列表
  contacts:
    - "李四"
    - "张三"

  # 消息监听配置
  monitor:
    base_sleep_time: 20  # 基础休眠时间（秒）
    max_sleep_time: 600  # 最大休眠时间（秒）
    retry_attempts: 3  # 消息发送重试次数

  # 聊天区域截取配置，可以调整以适应不同屏幕分辨率和微信窗口布局
  capture:
    left_offset: 400      # 左侧偏移量（跳过左侧联系人栏）
    top_offset: 75        # 顶部偏移量（跳过标题栏）
    bottom_offset: 230   # 底部偏移量（跳过输入栏）,最好调整小一些，保证截图聊天记录完整
  search_position:
    x_offset: 150       # 搜索框相对于窗口左边的水平偏移
    y_offset: 40        # 搜索框相对于窗口顶部的垂直偏移
# ============ 记忆模块配置 (Mem0) ============
memory:
  enabled: true
  # 窗口大小（对话轮数）
  window_size: 10
  # Mem0 LLM 配置（复用聊天模型的 LM Studio 地址）
  llm:
    provider: "openai"
    model: "qwen/qwen3.5-9b"
    openai_base_url: "http://localhost:1234/v1"
    api_key: "not-needed"
  # 嵌入模型配置（复用本地的 BGE-M3）
  embedder:
    provider: "huggingface"
    model: "./models/BAAI/bge-m3"
    device: "cpu"
    embedding_dims: 1024
  # 向量数据库配置
  vector_store:
    collection_name: "wechat_history"
    path: "./chat_db"
  # 检索增强配置（HyDE / BM25 / Reranker）
  search:
    hyde_max_chars: 3        # 查询字符数 ≤ 此值时跳过 HyDE（方案A）
    hybrid_search: true      # 开启 BM25 + 向量混合检索（方案B）
    bm25_weight: 1         # BM25 结果的 RRF 融合权重（越大越偏向关键词匹配）
    score_threshold: 0.96    # 严格分数过滤（方案C）
    top_k: 5                 # 最终注入 prompt 的记忆条数
    reranker:
      enabled: true          # 使用 mem0 内置 Cross-Encoder 精排
      model: "BAAI/bge-reranker-v2-m3"

# LM Studio / Qwen3-VL 模型配置
# 聊天模型配置
chat_model:
  api_base: "http://localhost:1234/v1"  # 修正URL格式
  api_key: "lm-studio"
  model_name: "qwen/qwen3.5-9b"
  max_tokens: 10240
  temperature: 0.7                            # 创造性参数 (0-1)

# 视觉模型配置（用于图片解析）
vision_model:
  api_base: "http://localhost:1234/v1"          # 视觉模型 API 地址
  api_key: "lm-studio"                          # 视觉模型 API 密钥
  model_name: "qwen3-vl-8b-instruct"            # 视觉模型名称（支持视觉的多模态模型）
  max_tokens: 4096                              # 最大输出长度
  temperature: 0.3  
# ============ Hooks 配置（确定性校验） ============
hooks:
  enabled: true
  length:
    enabled: true
    max_chars: 30
  banned_words:
    enabled: true
    words:
      - "作为AI"
      - "是AI"
      - "作为一个人工智能"
      - "有什么可以帮您"
      - "请问有什么"
      - "我来帮你"
      - "我来为您"
      - "理解您的感受"
  format:
    enabled: true
  duplicate:
    enabled: true
    similarity_threshold: 0.5

# 调试配置
debug:
  screenshot_path: "debug_last_msg.png"